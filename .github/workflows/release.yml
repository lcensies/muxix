name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  BIN_NAME: muxix

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS builds (use cargo directly)
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: muxix-darwin-arm64
            use_cross: false
          - os: macos-15
            target: x86_64-apple-darwin
            artifact: muxix-darwin-amd64
            use_cross: false
          # Linux builds (use cross with musl for static linking)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: muxix-linux-amd64
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: muxix-linux-arm64
            use_cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: |
          if [ "${{ matrix.use_cross }}" == "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
      - name: Package
        run: |
          bin="target/${{ matrix.target }}/release/${BIN_NAME}"
          # Binary is already stripped via Cargo.toml profile.release.strip
          tar -C "$(dirname "$bin")" -czf ${{ matrix.artifact }}.tar.gz ${BIN_NAME}
          shasum -a 256 ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # Built-in token; the job already has `contents: write`.
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          # Keep these asset names stable: scripts/install.sh and
          # [package.metadata.binstall] in Cargo.toml download them by name.
          files: |
            *.tar.gz
            *.sha256
          # `releases/latest` must resolve for scripts/install.sh.
          draft: false
          prerelease: false
          make_latest: true
