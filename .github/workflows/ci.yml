name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        # -p muxix, not --all: vendor/ holds upstream crates we keep verbatim.
        run: cargo fmt -p muxix -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --bins

  python:
    # Lints the end-to-end suite. Running it needs a multiplexer, so CI only
    # checks that it is well-formed; `just test` runs it locally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `src` scopes the run; a path in `args` is appended to the workspace
      # root, so ruff would lint the whole repo instead of just tests/.
      - uses: astral-sh/ruff-action@v3
        with:
          args: check
          src: tests

      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check
          src: tests
